<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ห้องแห่งความลับ - Base64 Only</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        
        body {
            background-color: #000000; /* พื้นหลังดำล้วนตามสั่งจ้า */
            color: #f8fafc;
            font-family: 'Sarabun', sans-serif;
            overflow: hidden; 
            touch-action: manipulation;
            position: relative;
        }

        /* ระบบสร้างดวงดาว */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }
        .preview-area {
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 15px 15px;
            background-color: rgba(15, 23, 42, 0.9);
        }
        audio {
            height: 40px;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-screen flex flex-col p-3 md:p-6 overflow-hidden">

    <!-- พื้นหลังดวงดาว -->
    <div id="stars" class="stars-container"></div>

    <!-- ส่วนหัว (Header) -->
    <header class="flex items-center justify-between mb-3 shrink-0 relative z-10">
        <div>
            <div class="flex flex-col leading-tight">
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400 flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-6 h-6 text-purple-400"></i> ห้องแห่งความลับ
                </h1>
                <span class="text-xs font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-400 ml-8" style="font-size: 0.75rem; opacity: 0.9;">
                    Base64 Only
                </span>
            </div>
        </div>
        <div id="global-status" class="hidden px-3 py-1 rounded-lg text-[10px] font-bold border border-purple-500/30 bg-purple-500/10 text-purple-400"></div>
    </header>

    <!-- ส่วนเนื้อหาหลัก -->
    <main class="flex-grow flex flex-col gap-3 min-h-0 relative z-10">
        
        <section class="glass-panel p-4 rounded-3xl shrink-0">
            <div class="relative group border-2 border-dashed border-slate-700 rounded-2xl p-4 text-center bg-slate-950/50 active:scale-95 transition-all">
                <input type="file" id="smartInput" class="absolute inset-0 opacity-0 cursor-pointer">
                <i data-lucide="plus-circle" class="w-8 h-8 mx-auto mb-2 text-purple-400"></i>
                <h2 class="text-sm font-semibold mb-1" id="upload-text">แตะที่นี่เพื่อเลือกไฟล์</h2>
                <p class="text-[10px] text-slate-500">ใส่ .txt เพื่อถอดรหัส | ใส่ไฟล์อื่นเพื่อเข้ารหัส</p>
            </div>
            
            <div id="result-actions" class="hidden mt-3 grid grid-cols-2 gap-2">
                <button id="main-download-btn" class="py-3 rounded-xl bg-white text-black text-xs font-bold flex items-center justify-center gap-2 active:bg-slate-200">
                    <i data-lucide="download" class="w-3 h-3"></i> <span id="btn-text">บันทึกไฟล์</span>
                </button>
                <button onclick="location.reload()" class="py-3 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold flex items-center justify-center gap-2">
                    <i data-lucide="refresh-cw" class="w-3 h-3"></i> เคลียร์หน้าจอ
                </button>
            </div>
        </section>

        <section id="preview-section" class="glass-panel rounded-3xl overflow-hidden flex flex-col flex-grow min-h-0 shadow-2xl">
            <div class="px-5 py-3 bg-slate-950/80 border-b border-slate-800 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2 overflow-hidden">
                    <i data-lucide="eye" class="w-4 h-4 text-purple-400 shrink-0"></i>
                    <span class="text-xs font-bold truncate" id="preview-filename">ยังไม่มีความลับให้แสดง...</span>
                </div>
                <span id="preview-tag" class="text-[8px] px-2 py-0.5 rounded bg-purple-500/20 text-purple-400 font-mono shrink-0">ว่างเปล่า</span>
            </div>
            
            <div id="preview-container" class="preview-area flex-grow overflow-y-auto p-4 flex items-center justify-center relative">
                <div id="empty-state" class="text-center opacity-30">
                    <i data-lucide="ghost" class="w-12 h-12 mx-auto mb-2 text-slate-500"></i>
                    <p class="text-[10px]">รอตะเองอัปโหลดอยู่นะจ๊ะ</p>
                </div>
                <div id="render-target" class="hidden w-full h-full flex items-center justify-center"></div>
            </div>
        </section>

    </main>

    <footer id="footer-stats" class="mt-3 grid grid-cols-12 gap-2 shrink-0 relative z-10">
        <div class="col-span-4 glass-panel px-3 py-2 rounded-xl flex flex-col">
            <span class="text-[8px] text-slate-500 uppercase">ขนาดไฟล์</span>
            <span id="stat-size" class="text-[10px] font-bold">0.00 MB</span>
        </div>
        <div class="col-span-4 glass-panel px-3 py-2 rounded-xl flex flex-col">
            <span class="text-[8px] text-slate-500 uppercase">สถานะ</span>
            <span id="stat-integrity" class="text-[10px] font-bold text-slate-600">พร้อมใช้งาน</span>
        </div>
        <div class="col-span-4 flex items-center justify-center text-[10px] text-slate-500 italic">
            จัดทำโดย: กูเองแหละ!
        </div>
    </footer>

    <script>
        lucide.createIcons();

        // --- ระบบสร้างดวงดาว 5 แฉก ---
        function createStars() {
            const container = document.getElementById('stars');
            const starCount = 100;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 4 + 2;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(star);
            }
        }
        createStars();

        function getTimestampedName() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            return `themuiz_${d}-${m}-${y}_${hh}-${mm}.txt`;
        }

        function encode64(uint8Array) {
            let binary = "";
            const len = uint8Array.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(uint8Array[i]);
            }
            return window.btoa(binary);
        }

        function decode64(base64String) {
            const binaryString = window.atob(base64String);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
        }

        async function compress(data) { return data; }
        async function decompress(data) { return data; }

        const inputEl = document.getElementById('smartInput');
        
        inputEl.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            notify("กำลังร่ายมนตร์...", "purple");
            document.getElementById('upload-text').innerText = file.name;

            try {
                if (file.name.toLowerCase().endsWith('.txt')) {
                    const text = await file.text();
                    try {
                        const json = JSON.parse(text);
                        const finalData = decode64(json.d); 
                        handleResult(finalData, json.n, json.t, 'decode');
                    } catch (err) {
                        console.error(err);
                        notify("ไฟล์ไม่ถูกต้องจ้า", "red");
                    }
                } else {
                    const buffer = await file.arrayBuffer();
                    const dataToEncode = new Uint8Array(buffer);
                    const b64 = encode64(dataToEncode); 
                    const payload = JSON.stringify({ n: file.name, t: file.type, d: b64 });
                    const blob = new Blob([payload], { type: "text/plain" });
                    handleResult(blob, "", "text/plain", 'encode', dataToEncode, file.name, file.type);
                }
            } catch (err) {
                console.error(err);
                notify("เวทมนตร์ล้มเหลว!", "red");
            }
        };

        function handleResult(resultBlobOrData, filename, mimeType, mode, originalBuffer = null, originalName = "", originalType = "") {
            document.getElementById('result-actions').classList.remove('hidden');
            const dlBtn = document.getElementById('main-download-btn');
            const btnText = document.getElementById('btn-text');
            
            if (mode === 'encode') {
                btnText.innerText = "บันทึกไฟล์ลับ";
                dlBtn.onclick = () => {
                    const dynamicName = getTimestampedName();
                    saveFile(resultBlobOrData, dynamicName);
                };
                renderPreview(originalBuffer, originalName, originalType);
                notify("เข้ารหัสแล้วนะ", "purple");
            } else {
                btnText.innerText = "เปิดเผยความจริง";
                const blob = new Blob([resultBlobOrData], { type: mimeType });
                dlBtn.onclick = () => saveFile(blob, filename);
                renderPreview(resultBlobOrData, filename, mimeType);
                notify("เปิดความลับแล้ว", "emerald");
            }
        }

        function renderPreview(data, name, type) {
            const target = document.getElementById('render-target');
            const empty = document.getElementById('empty-state');
            const fileNameEl = document.getElementById('preview-filename');
            const tagEl = document.getElementById('preview-tag');
            const sizeStat = document.getElementById('stat-size');
            const integrityStat = document.getElementById('stat-integrity');
            
            empty.classList.add('hidden');
            target.classList.remove('hidden');
            target.innerHTML = '';
            
            fileNameEl.innerText = name || "กำลังเตรียมความลับ...";
            tagEl.innerText = type ? type.toUpperCase().split('/')[0] : 'ข้อมูล';
            sizeStat.innerText = (data.byteLength / (1024 * 1024)).toFixed(2) + " MB";
            integrityStat.innerText = "ถูกต้องแม่นยำ";
            integrityStat.classList.replace('text-slate-600', 'text-emerald-400');

            if (type.startsWith('audio/')) {
                const blob = new Blob([data], { type });
                const url = URL.createObjectURL(blob);
                target.innerHTML = `
                    <div class="text-center w-full p-4 glass-panel rounded-2xl">
                        <i data-lucide="music" class="w-10 h-10 mx-auto mb-2 text-pink-400"></i>
                        <p class="text-[10px] mb-3 text-slate-400">เครื่องเล่นเสียงของตะเอง</p>
                        <audio controls class="w-full">
                            <source src="${url}" type="${type}">
                        </audio>
                    </div>
                `;
            } else if (type.startsWith('image/')) {
                const blob = new Blob([data], { type });
                const img = document.createElement('img');
                img.src = URL.createObjectURL(blob);
                img.className = 'max-w-full max-h-full rounded-xl object-contain shadow-lg';
                target.appendChild(img);
            } else if (type.startsWith('text/') || type === 'application/json') {
                const text = new TextDecoder().decode(data);
                target.innerHTML = `
                    <pre class="text-[10px] text-slate-400 p-4 bg-slate-900/50 rounded-xl w-full h-full overflow-auto text-left font-mono whitespace-pre-wrap">${text.slice(0, 2000)}</pre>
                `;
            } else {
                target.innerHTML = `
                    <div class="text-center">
                        <i data-lucide="shield-check" class="w-12 h-12 mx-auto mb-2 text-purple-600"></i>
                        <p class="text-[10px] text-slate-500 font-bold uppercase">สำเร็จแล้วจ้า</p>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function notify(msg, type) {
            const el = document.getElementById('global-status');
            el.innerText = msg;
            el.classList.remove('hidden');
            el.className = `px-3 py-1 rounded-lg text-[10px] font-bold border block bg-${type}-500/10 text-${type}-400 border-${type}-500/30`;
            setTimeout(() => { if(!msg.includes("กำลัง")) el.classList.add('hidden'); }, 3000);
        }

        function saveFile(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
