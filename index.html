<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TheMuiz Base64</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Sarabun:wght@400;700&display=swap');
        
        body { 
            font-family: 'Inter', 'Sarabun', sans-serif; 
            height: 100vh; 
            margin: 0; 
            background: #000; 
            color: white; 
            overflow: hidden; 
        }

        .full-screen-app {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: radial-gradient(circle at center, #111827 0%, #000 100%);
        }

        .content-card {
            background-color: #1f2937;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 52rem;
            height: 90vh; 
            display: flex;
            flex-direction: column;
            border: 1px solid #374151;
            overflow: hidden;
        }

        .card-header {
            padding: 1.5rem 1.5rem 0.5rem 1.5rem;
            flex-shrink: 0;
        }

        .card-body {
            padding: 1rem 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow: hidden; 
        }

        .card-footer {
            padding: 0.75rem;
            text-align: center;
            border-top: 1px solid #374151;
            flex-shrink: 0;
        }

        .scrollable-box {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            word-break: break-all;
            background-color: #111827;
            border-radius: 0.75rem;
            border: 1px solid #374151;
            font-family: monospace;
            font-size: 0.875rem;
        }

        .fixed-input-area {
            height: 35%;
            min-height: 100px;
        }

        .fixed-output-area {
            height: 45%;
            min-height: 120px;
            display: flex;
            flex-direction: column;
        }

        .image-preview-container {
            max-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .btn-action {
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-action:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="full-screen-app">
        <div class="content-card">
            <!-- Header -->
            <div class="card-header">
                <h1 class="text-3xl font-black text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-emerald-400">
                    TheMuiz Base64 🚀
                </h1>
            </div>

            <!-- Body -->
            <div class="card-body">
                <!-- Section 1: Input -->
                <div class="fixed-input-area flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <h2 class="text-sm font-bold text-blue-300">กรอกข้อความ / วาง Base64</h2>
                        <div class="flex items-center gap-2">
                            <span id="charCountInput" class="text-[10px] text-gray-500 font-mono">0 ตัว</span>
                            <button onclick="clearAll()" class="p-1.5 bg-red-600/20 hover:bg-red-600/40 text-red-400 rounded-md transition-colors" title="ล้างทั้งหมด">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5 v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                                    <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <textarea id="universalInput" 
                        class="scrollable-box w-full p-3 bg-gray-900 border-gray-700 focus:ring-1 focus:ring-blue-500 outline-none resize-none"
                        placeholder="วาง Base64 หรือพิมพ์ข้อความที่นี่..."></textarea>
                </div>

                <!-- Section 2: Output -->
                <div class="fixed-output-area gap-2">
                    <div class="flex justify-between items-center">
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">แสดงผลข้อมูล:</p>
                        <span id="charCountOutput" class="text-[10px] text-gray-500 font-mono">0 ตัว</span>
                    </div>
                    
                    <!-- Text Result -->
                    <div id="textResultBox" class="flex-grow overflow-hidden flex flex-col">
                        <div id="universalOutput" onclick="copyContent('universalOutput')" 
                            class="scrollable-box p-3 text-emerald-400 cursor-pointer hover:bg-gray-800/50 transition-all">
                            กูรอมึงกรอกข้อมูลอยู่นะไอ้สัส
                        </div>
                    </div>

                    <!-- Image/File Result -->
                    <div id="imageResultBox" class="hidden flex-grow overflow-hidden bg-gray-900 rounded-lg border border-gray-700 p-2 text-center">
                        <div class="image-preview-container h-full">
                            <div id="filePreviewIcon" class="text-4xl mb-2 hidden">📄</div>
                            <img id="decodedImgPreview" class="max-h-[70%] rounded shadow-lg mb-2 hidden" />
                            <p id="fileNameDisplay" class="text-[10px] text-blue-300 mb-2"></p>
                            <div class="flex gap-2">
                                <button id="downloadBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-1.5 px-4 rounded-md text-[10px] transition-all flex items-center gap-2">
                                    💾 บันทึกไฟล์คืนค่า
                                </button>
                                <button id="saveTxtBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-4 rounded-md text-[10px] transition-all flex items-center gap-2">
                                    📄 บันทึกรหัสเป็นไฟล์ .txt
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section 3: File Upload Channels -->
                <div class="flex gap-3 h-[15%] flex-shrink-0">
                    <!-- Channel 1: Universal File to Base64 -->
                    <label class="flex-1 flex flex-col items-center justify-center border-2 border-blue-600/50 border-dashed rounded-lg cursor-pointer bg-gray-900 hover:bg-gray-800 transition-all text-center p-1">
                        <p class="text-[10px] text-blue-400 font-bold">📁 แปลงไฟล์ทุกชนิดเป็นรหัส</p>
                        <p class="text-[8px] text-gray-500">(รูป, เพลง, วิดีโอ, ฯลฯ)</p>
                        <input id="uploadImage" type="file" class="hidden" accept="*/*" />
                    </label>

                    <!-- Channel 2: Text/Txt to Media/Text -->
                    <label class="flex-1 flex flex-col items-center justify-center border-2 border-emerald-600/50 border-dashed rounded-lg cursor-pointer bg-gray-900 hover:bg-gray-800 transition-all text-center p-1">
                        <p class="text-[10px] text-emerald-400 font-bold">📄 แปลงไฟล์ .txt คืนค่า</p>
                        <p class="text-[8px] text-gray-500">(ดึงรหัสจากไฟล์)</p>
                        <input id="uploadTxt" type="file" class="hidden" accept=".txt" />
                    </label>
                </div>
            </div>

            <!-- Footer -->
            <div class="card-footer">
                <div class="text-gray-600 text-[9px] leading-tight">
                    TheMuiz Base64 | มะลิจัดให้
                </div>
                <div class="text-gray-500 text-[10px] font-bold">
                    อัปเกรดระบบรองรับทุกไฟล์ (Universal Support)
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-8 py-2 rounded-full shadow-2xl hidden z-50 text-sm font-bold pointer-events-none">
        คัดลอกแล้วจ้า ✅
    </div>

    <script>
        const universalInput = document.getElementById('universalInput');
        const universalOutput = document.getElementById('universalOutput');
        const imageResultBox = document.getElementById('imageResultBox');
        const textResultBox = document.getElementById('textResultBox');
        const decodedImgPreview = document.getElementById('decodedImgPreview');
        const filePreviewIcon = document.getElementById('filePreviewIcon');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const charCountInput = document.getElementById('charCountInput');
        const charCountOutput = document.getElementById('charCountOutput');
        const downloadBtn = document.getElementById('downloadBtn');
        const saveTxtBtn = document.getElementById('saveTxtBtn');
        const uploadImage = document.getElementById('uploadImage');
        const uploadTxt = document.getElementById('uploadTxt');

        universalInput.addEventListener('input', () => {
            processInput(universalInput.value);
        });

        function processInput(val) {
            val = val.trim();
            charCountInput.innerText = `${val.length} ตัว`;
            
            if (!val) { resetUniversal(); return; }
            
            // ตรวจสอบว่าเป็น Base64 ที่มี Header (Data URL) หรือไม่
            if (val.startsWith('data:')) { 
                showMediaResult(val); 
                charCountOutput.innerText = `${val.length} ตัว`;
            } 
            else if (isBase64(val)) {
                const decodedText = decodeUTF8(val);
                if (decodedText && decodedText.length < 50000) { 
                    showTextResult(decodedText); 
                    charCountOutput.innerText = `${decodedText.length} ตัว`;
                } else {
                    showTextResult(val); // ถ้าไม่ใช่ข้อความ ให้โชว์รหัสตัวมันเองเพื่อให้คัดลอกได้
                    charCountOutput.innerText = `${val.length} ตัว`;
                }
            } 
            else { 
                encodeNormalText(val); 
            }
        }

        function encodeNormalText(val) {
            try {
                const bytes = new TextEncoder().encode(val);
                const binString = String.fromCodePoint(...bytes);
                const result = btoa(binString);
                showTextResult(result);
                charCountOutput.innerText = `${result.length} ตัว`;
            } catch (e) { 
                showTextResult("เกิดข้อผิดพลาดในการเข้ารหัส..."); 
                charCountOutput.innerText = `0 ตัว`;
            }
        }

        function showTextResult(text) {
            universalOutput.innerText = text;
            textResultBox.classList.remove('hidden');
            imageResultBox.classList.add('hidden');
        }

        function showMediaResult(base64) {
            imageResultBox.classList.remove('hidden');
            textResultBox.classList.add('hidden');
            
            const mime = base64.split(';')[0].split(':')[1] || 'application/octet-stream';
            fileNameDisplay.innerText = `ชนิดไฟล์: ${mime}`;

            if (mime.startsWith('image/')) {
                decodedImgPreview.src = base64;
                decodedImgPreview.classList.remove('hidden');
                filePreviewIcon.classList.add('hidden');
            } else {
                decodedImgPreview.classList.add('hidden');
                filePreviewIcon.classList.remove('hidden');
                filePreviewIcon.innerText = mime.startsWith('audio/') ? '🎵' : (mime.startsWith('video/') ? '🎬' : '📄');
            }
            
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.href = base64;
                const ext = mime.split('/')[1] || 'bin';
                link.download = `TheMuiz_Restore_${Date.now()}.${ext}`;
                link.click();
            };

            saveTxtBtn.onclick = () => {
                const blob = new Blob([base64], { type: 'text/plain' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "TheMuiz_Base64_Code.txt";
                link.click();
                URL.revokeObjectURL(link.href);
                showToast("บันทึกไฟล์ .txt สำเร็จ! 💾");
            };
        }

        function resetUniversal() {
            universalOutput.innerText = 'กูรอมึงกรอกข้อมูลอยู่นะไอ้สัส';
            textResultBox.classList.remove('hidden');
            imageResultBox.classList.add('hidden');
            charCountInput.innerText = '0 ตัว';
            charCountOutput.innerText = '0 ตัว';
        }

        uploadImage.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    universalInput.value = base64;
                    processInput(base64);
                    showToast("แปลงไฟล์เป็นรหัสแล้ว! ✅");
                }
                reader.readAsDataURL(file);
            }
        });

        uploadTxt.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    universalInput.value = content;
                    processInput(content);
                    showToast("ดึงรหัสคืนค่าสำเร็จ! ✅");
                }
                reader.readAsText(file);
            }
        });

        function isBase64(str) {
            if (str.length % 4 !== 0) return false;
            const regex = /^[A-Za-z0-9+/]*={0,2}$/;
            return regex.test(str);
        }

        function decodeUTF8(base64) {
            try {
                const binString = atob(base64);
                const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
                return new TextDecoder().decode(bytes);
            } catch (e) { return null; }
        }

        function copyContent(id) {
            const target = document.getElementById(id);
            const content = target.innerText;
            if (content.includes('กูรอมึงกรอกข้อมูล')) return;
            
            const el = document.createElement('textarea');
            el.value = content;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("คัดลอกแล้วจ้า ✅");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 1500);
        }

        function clearAll() {
            universalInput.value = '';
            uploadImage.value = '';
            uploadTxt.value = '';
            resetUniversal();
            showToast("ล้างข้อมูลแล้ว 🧹");
        }
    </script>
</body>
</html>
